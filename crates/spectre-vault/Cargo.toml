[package]
name = "spectre-vault"
version = "0.1.0"
edition = "2021"
description = "Vault storage and .mpjson import for spectre-upgrade. Encrypted at rest."
license = "MPL-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
zeroize = "1"
thiserror = "1"

[dev-dependencies]
spectre-core = { path = "../spectre-core" }
