[workspace]
members = ["crates/spectre-core", "crates/spectre-cli", "crates/spectre-vault", "src-tauri"]
resolver = "2"

# Optimize only the KDF crates in dev builds, so scrypt (the master-key function)
# runs in well under a second at unlock. Everything else stays unoptimized for
# fast incremental compiles.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Release profile lives at the workspace root (member-crate profiles are ignored).
# LTO and codegen-units=1 are intentionally left at their fast defaults: they
# make release builds much slower/heavier for a negligible size win on an app
# this small.
[profile.release]
opt-level = 3
panic = "abort"
strip = true
